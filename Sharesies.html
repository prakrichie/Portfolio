<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharesies: Designing a guided first-week experience for new investors</title>
<meta name="description" content="A case study on designing a guided onboarding experience for new Sharesies investors. UX/UI Designer, Master's capstone 2024.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ───────────────────────────────────────
     TOKENS
  ─────────────────────────────────────── */
  :root {
    --bg:       #ffffff;
    --bg-2:     #F7F6F3;
    --bg-page:  #ECEAE4;
    --ink:      #0D0D0D;
    --ink-mid:  #4A4A48;
    --ink-light:#595959;
    --border:   #EAEAE6;
    --border-strong: #D4D4D0;
    --mute:     #C8C8C4;
    --green:    #3DD68C;
    --green-bg: #EAF9F1;
    --pink:     #E8366A;
    --pink-bg:  #FEE8EF;
    --red:      #E55555;

    /* Sharesies brand palette (from old case study) */
    --brand-pink:  #D83F6E;   /* large type & accents, AAA ≥18px/14px bold */
    --pink-deep:   #9E1A4A;   /* small text AAA on white/pink-bg (7.76:1) */
    --pink-tint:   #FCEEF2;   /* soft pink wash for quote/callout bodies */
    --purple:      #47446D;   /* H2/H3 heading colour, AAA on white */
    --cream:       #F4F2EC;   /* warm alt page background */

    --font-mono: 'Familjen Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;

    --topnav-h: 56px;
    --sidebar-w: 260px;
    --content-max: 900px;

    --ease: cubic-bezier(.2, .8, .2, 1);
  }

  /* ───────────────────────────────────────
     RESET / BASE
  ─────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    overflow: hidden; /* the .content pane scrolls, not body */
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-2); }
  ::-webkit-scrollbar-thumb { background: var(--mute); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: #9C9C96; }

  /* ───────────────────────────────────────
     APP SHELL
  ─────────────────────────────────────── */
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* Top nav */
  .topnav {
    height: var(--topnav-h);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: relative;
    z-index: 20;
  }
  .topnav .crumb-work { font-size: 14px; color: var(--ink-light); }
  .topnav .crumb-sep  { font-size: 14px; color: var(--border-strong); margin: 0 10px; }
  .topnav .crumb-now  { font-size: 14px; font-weight: 500; color: var(--ink); }
  .topnav .topnav-spacer { flex: 1; }
  .topnav .topnav-links { display: flex; gap: 28px; }
  .topnav .topnav-links a { font-size: 14px; color: var(--ink-light); transition: color .2s var(--ease); }
  .topnav .topnav-links a:hover { color: var(--ink); }
  .topnav .menu-btn {
    display: none;
    width: 40px; height: 40px;
    margin-left: auto;
    align-items: center; justify-content: center;
    border-radius: 8px;
  }
  .topnav .menu-btn:hover { background: var(--bg-2); }
  .topnav .menu-btn svg { width: 18px; height: 18px; }

  /* Main layout */
  .layout {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    flex: 0 0 auto;
    border-right: 1px solid var(--border);
    background: var(--bg);
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  .sidebar-head {
    padding: 22px 22px 18px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-head .kicker { font-size: 13px; color: #1D1D1D; margin-bottom: 4px; letter-spacing: .01em; }
  .sidebar-head .title  { font-size: 22px; font-weight: 600; color: #d83f6e; letter-spacing: -.005em; }

  .progress {
    padding: 14px 22px 4px;
  }
  .progress-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .progress-row span { font-size: 12px; color: var(--ink); font-weight: 500; }
  .progress-row .pct { font-variant-numeric: tabular-nums; color: #d83f6e; font-weight: 600; }
  .progress-track {
    height: 8px; background: var(--border); border-radius: 99px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0;
    background: #d83f6e;
    border-radius: 99px;
    transition: width .45s var(--ease);
  }

  .nav-groups { padding: 8px 0 24px; }
  .nav-group { margin-top: 14px; }
  .nav-group-label {
    font-size: 12px; font-weight: 600;
    color: var(--ink-light);
    padding: 0 22px;
    margin-bottom: 4px;
    letter-spacing: .02em;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 22px;
    border-right: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    transition: background .15s var(--ease), border-color .15s var(--ease);
    text-align: left;
    width: 100%;
  }
  .nav-item:hover { background: var(--pink-tint); }
  .nav-item:hover .nav-label { color: #d83f6e; }
  .nav-item:hover .nav-dot { border-color: #d83f6e; }
  .nav-item:focus-visible { outline: 2px solid #d83f6e; outline-offset: -2px; }

  .nav-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: transparent;
    border: 1.5px solid var(--border-strong);
    transition: background .2s var(--ease), border-color .2s var(--ease);
  }
  .nav-label {
    font-size: 13.5px;
    font-weight: 400;
    color: var(--ink-mid);
    line-height: 1.35;
    transition: color .15s var(--ease), font-weight .15s var(--ease);
  }

  /* states */
  .nav-item.is-done .nav-dot {
    background: var(--mute);
    border-color: var(--mute);
  }
  .nav-item.is-done .nav-label { color: var(--ink-light); }

  .nav-item.is-active {
    background: var(--pink-tint);
    border-right-color: #d83f6e;
  }
  .nav-item.is-active .nav-dot {
    background: #d83f6e;
    border-color: #d83f6e;
  }
  .nav-item.is-active .nav-label {
    color: #d83f6e;
    font-weight: 600;
  }

  /* Content pane */
  .content {
    flex: 1 1 auto;
    overflow-y: auto;
    background: var(--bg);
    min-width: 0;
    scroll-behavior: smooth;
  }
  .content-inner {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 48px 56px 96px;
  }
  .content-inner[data-section="intro"],
  .content-inner[data-section="brief"],
  .content-inner[data-section="process"],
  .content-inner[data-section="discoveries"],
  .content-inner[data-section="onboarding"],
  .content-inner[data-section="gamedesign"],
  .content-inner[data-section="desk"],
  .content-inner[data-section="reframe"],
  .content-inner[data-section="objectives"],
  .content-inner[data-section="participants"],
  .content-inner[data-section="qualitative"],
  .content-inner[data-section="insights"],
  .content-inner[data-section="principles"],
  .content-inner[data-section="gtg"],
  .content-inner[data-section="workshop"],
  .content-inner[data-section="concept"],
  .content-inner[data-section="modules"],
  .content-inner[data-section="lofi"],
  .content-inner[data-section="lofifindings"],
  .content-inner[data-section="midfi"],
  .content-inner[data-section="midfitest"],
  .content-inner[data-section="blocks"],
  .content-inner[data-section="hifi"],
  .content-inner[data-section="deliverables"],
  .content-inner[data-section="limitations"],
  .content-inner[data-section="future"],
  .content-inner[data-section="learnings"] { max-width: 1080px; }

  .content-inner[data-section="brief"] .brief-products .brief-product {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    background: var(--bg);
  }
  .content-inner[data-section="brief"] .brief-products .brief-product-body {
    font-size: 15.5px;
  }

  /* Section transitions */
  .section { display: none; }
  .section.is-visible { display: block; }

  /* Scroll-triggered content reveals */
  .reveal {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .55s var(--ease), transform .55s var(--ease);
  }
  .reveal.is-in {
    opacity: 1;
    transform: none;
  }
  .content-inner[data-section="process"] .dd-diagram {
    background: #f4f2ec;
    padding: 24px 0;
    margin: 0 0 28px;
    text-align: center;
  }
  .content-inner[data-section="process"] .dd-diagram img {
    width: 50%;
    display: inline-block;
    vertical-align: middle;
  }

  /* Poster lightbox */
  .poster-wrap {
    background: #f4f2ec;
    border-radius: 12px;
    padding: 24px;
    margin: 0 0 14px;
    cursor: zoom-in;
    transition: opacity .2s var(--ease);
  }
  .poster-wrap:hover { opacity: .88; }
  .poster-wrap img { width: 100%; display: block; border-radius: 8px; }
  .poster-hint {
    font-size: 13px; color: var(--ink-mid);
    display: flex; align-items: center; gap: 5px; margin-bottom: 14px;
  }

  .lightbox-overlay {
    position: fixed; inset: 0; z-index: 9000;
    background: rgba(13,13,13,.85);
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
    opacity: 0; pointer-events: none;
    transition: opacity .3s var(--ease);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: zoom-out;
  }
  .lightbox-overlay.is-open { opacity: 1; pointer-events: all; }
  .lightbox-overlay img {
    max-width: 100%; max-height: 100%;
    border-radius: 12px;
    box-shadow: 0 32px 80px rgba(0,0,0,.4);
    transform: scale(.94);
    transition: transform .35s cubic-bezier(.22,.61,.36,1);
  }
  .lightbox-overlay.is-open img { transform: scale(1); }
  .lightbox-close {
    position: absolute; top: 20px; right: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.12);
    color: #fff; font-size: 22px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .2s var(--ease);
  }
  .lightbox-close:hover { background: rgba(255,255,255,.25); }

  .gi-stack { display: flex; flex-direction: column; gap: 0; margin-bottom: 28px; }
  .gi-row {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 36px;
    align-items: start;
    padding: 28px 0;
    border-top: 1px solid var(--border);
  }
  .gi-row:first-child { border-top: 0; padding-top: 4px; }
  .gi-row .gi-frame {
    background: #f4f2ec;
    border-radius: 12px;
    padding: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .gi-row .gi-frame img { width: 100%; max-width: 200px; display: block; border-radius: 6px; }
  .gi-row .gi-label {
    font-size: 12px; font-weight: 700; color: #47446D;
    letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px;
  }
  .gi-row .gi-title {
    font-size: 19.5px; font-weight: 600; color: var(--ink);
    margin-bottom: 12px; line-height: 1.3;
  }
  .gi-row .gi-body {
    font-size: 15.5px; color: var(--ink-mid);
    line-height: 1.75; margin: 0 0 12px;
    max-width: 62ch;
  }
  .gi-row .gi-body:last-child { margin-bottom: 0; }

  /* Hi-fi sliding smartphones carousel */
  .hifi-carousel { margin: 0 0 28px; }
  .hifi-stage {
    position: relative;
    background: #FDEDF1;
    border-radius: 16px;
    padding: 48px 16px 44px;
    overflow: hidden;
  }
  .hifi-track-wrap {
    position: relative;
    overflow: hidden;
    mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%);
  }
  .hifi-track {
    display: flex;
    gap: 24px;
    transition: transform .55s cubic-bezier(.22,.61,.36,1);
    will-change: transform;
  }
  .hifi-slide {
    flex: 0 0 240px;
    transform: scale(.82);
    opacity: .45;
    transition: transform .55s cubic-bezier(.22,.61,.36,1), opacity .45s var(--ease);
    filter: drop-shadow(0 14px 28px rgba(27,26,23,.08));
  }
  .hifi-slide.is-active { transform: scale(1); opacity: 1; }
  .hifi-slide img { width: 100%; height: auto; display: block; border-radius: 22px; }

  .hifi-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: #fff; border: 1px solid var(--border);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; line-height: 1; cursor: pointer;
    box-shadow: 0 4px 12px rgba(27,26,23,.08);
    transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
    z-index: 2;
  }
  .hifi-nav:hover { background: var(--ink); color: #fff; transform: translateY(-50%) scale(1.05); }
  .hifi-nav:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .hifi-prev { left: 20px; }
  .hifi-next { right: 20px; }

  .hifi-meta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-top: 18px;
  }
  .hifi-caption {
    font-size: 15.5px; color: var(--ink); font-weight: 600;
  }
  .hifi-counter {
    font-size: 13px; color: var(--ink-mid);
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
  }
  .hifi-dots { display: flex; gap: 6px; }
  .hifi-dot {
    width: 8px; height: 8px; border-radius: 50%;
    border: 0; padding: 0; cursor: pointer;
    background: var(--border-strong);
    transition: background .2s var(--ease), width .25s var(--ease);
  }
  .hifi-dot:hover { background: var(--ink-mid); }
  .hifi-dot.is-active { background: var(--ink); width: 22px; border-radius: 99px; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .progress-bar { transition: none; }
    * { scroll-behavior: auto !important; }
  }

  /* ───────────────────────────────────────
     CONTENT ATOMS
  ─────────────────────────────────────── */
  .eyebrow {
    font-size: 14px;
    color: var(--ink-light);
    margin-bottom: 14px;
  }
  h1.section-title {
    font-size: 37px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -.03em;
    color: #d83f6e;
    margin-bottom: 16px;
  }
  .accent-pink { color: var(--ink); }
  .content-inner[data-section="intro"] h1.section-title { color: #1b1a17; }
  .content-inner[data-section="intro"] h1.section-title .accent-pink { color: #d83f6e; }
  .lede {
    font-size: 19.5px;
    line-height: 1.6;
    color: var(--ink-mid);
    margin-bottom: 32px;
  }
  h2.sub-head {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -.02em;
    color: var(--purple);
    margin: 0 0 14px;
  }
  h2.sub-head span { color: var(--ink-light); }
  .rule {
    height: 1px;
    background: var(--border);
    margin: 32px 0;
    border: 0;
  }
  .rule-accent {
    height: 2px;
    background: var(--brand-pink);
    margin: 32px 0;
    border: 0;
    width: 60px;
  }
  .section-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 14px;
  }
  .section-label .sublabel {
    font-weight: 400;
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0;
  }

  .card {
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
  }
  .card.is-muted { background: var(--bg-2); }
  .card-h {
    font-size: 15.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .card-body {
    font-size: 15.5px;
    color: var(--ink-mid);
    line-height: 1.6;
  }
  .card-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-light);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .list-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
    background: var(--bg);
  }
  .list-row {
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 12px;
    padding: 16px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: 0; }
  .list-row.is-mine { background: var(--bg-2); grid-template-columns: 40px 1fr auto; }
  .list-row .row-num {
    font-size: 14px; font-weight: 700;
    color: var(--ink-mid);
    margin-top: 2px; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .list-row.is-mine .row-num { color: #47446D; }
  .list-row .row-title { font-size: 16.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .list-row .row-body { font-size: 15.5px; color: var(--ink-mid); line-height: 1.6; }
  .list-row .row-pill {
    font-size: 11px; font-weight: 600;
    background: #47446D; color: #fff;
    padding: 3px 9px; border-radius: 20px;
    white-space: nowrap; margin-top: 3px;
    letter-spacing: .04em;
    align-self: start;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .grid-gap-lg { gap: 16px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .stats-grid .stat {
    padding: 18px 16px;
    border-right: 1px solid var(--border);
    text-align: center;
  }
  .stats-grid .stat:last-child { border-right: 0; }
  .stats-grid .stat-num {
    font-size: 32.5px; font-weight: 600; letter-spacing: -.04em;
    color: var(--ink); line-height: 1; margin-bottom: 6px;
  }
  .stats-grid .stat-lbl {
    font-size: 13px; color: var(--ink-light); line-height: 1.35;
  }

  .img-ph {
    background: var(--bg-2);
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-light);
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .avatars { display: flex; gap: 10px; align-items: flex-start; }
  .avatar { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .avatar-circle {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--ink-mid);
  }
  .avatar.is-me .avatar-circle { background: var(--ink); color: #fff; border-color: var(--ink); }
  .avatar-name { font-size: 15.5px; color: var(--ink-mid); }
  .avatar.is-me .avatar-name { color: var(--ink); font-weight: 600; }

  .pink-tag {
    display: inline-block;
    background: var(--pink); color: #fff;
    font-size: 13px; font-weight: 600;
    padding: 5px 14px; border-radius: 6px;
    margin-bottom: 18px;
    letter-spacing: .01em;
  }
  .prose-p {
    font-size: 17.5px; color: var(--ink-mid); line-height: 1.75;
    margin-bottom: 28px;
  }
  .prose-p:last-child { margin-bottom: 0; }

  .shmuxd-stamp { text-align: center; margin: 24px 0; }
  .shmuxd-stamp .big {
    font-size: 28.5px; font-weight: 700; color: var(--pink); letter-spacing: -.01em;
  }
  .shmuxd-stamp .small {
    font-size: 17.5px; color: var(--ink-mid); margin-left: 6px;
  }

  .pm-check {
    display: flex; gap: 8px; margin-bottom: 8px;
    font-size: 15.5px; color: var(--ink-mid); line-height: 1.55;
  }
  .pm-check .sym { font-size: 15.5px; margin-top: -1px; flex: 0 0 12px; font-weight: 700; }

    border-top: 1.4px solid currentColor;
    border-right: 1.4px solid currentColor;
    transform: rotate(45deg);
    color: var(--ink-light);
    opacity: .45;
    transition: opacity .2s var(--ease), color .2s var(--ease);
  }
  .star-row:hover { background: var(--bg-2); }
  .star-row:hover::after { opacity: 1; }
  .star-row:focus-visible { outline: 2px solid var(--gl-accent); outline-offset: 1px; }
  .star-row[aria-selected="true"] { background: var(--bg-2); }
  .star-row[aria-selected="true"]::before { opacity: 1; }
  .star-row[aria-selected="true"]::after { opacity: 1; color: var(--gl-accent); }
  .star-row[aria-selected="true"] .star-body { color: var(--ink); }

  .star-label {
    display: block;
    font-family: var(--gl-mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .13em;
    text-transform: uppercase;

    font-size: 14.5px;
    line-height: 1.62;
    color: var(--ink-mid);
    max-width: 66ch;
    transition: color .2s var(--ease);

  }

  .glance-tags {

    flex-wrap: wrap;
    gap: 6px;
    margin-top: 20px;
    padding-top: 18px;

    font-family: var(--gl-mono);
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--ink-light);
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 8px;
  }

  .glance-panel-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
  }

    margin-left: auto;
    font-family: var(--gl-mono);
    font-size: 10.5px;
    letter-spacing: .04em;
    color: var(--ink-light);
    white-space: nowrap;

  .glance-band { display: grid; gap: 8px; }
  .band-label {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--gl-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-light);
    transition: color .2s var(--ease);
  }
  .band-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .band-cards {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  @container flow (min-width: 300px) { .band-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @container flow (min-width: 430px) { .band-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .flow-card {
    display: grid;
    gap: 2px;
    padding: 11px 11px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg);
    transition: border-color .22s var(--ease), box-shadow .22s var(--ease);
  }
  .flow-icon {
    display: block;
    margin-bottom: 5px;
    color: var(--ink-light);
    transition: color .22s var(--ease);
  }
  .flow-icon svg { width: 18px; height: 18px; }
  .flow-label {
    font-size: clamp(11px, 2.9cqi, 12.5px);
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
    hyphens: auto;                 /* safety net for long single-word labels */
    overflow-wrap: break-word;
  }
  .flow-note {
    font-size: clamp(10px, 2.5cqi, 11px);
    line-height: 1.35;
    color: var(--ink-light);
  }

  /* Selected STAR row lights its band */
  .glance[data-active="task"]   .glance-band[data-band="task"]   .band-label,
  .glance[data-active="action"] .glance-band[data-band="action"] .band-label,
  .glance[data-active="result"] .glance-band[data-band="result"] .band-label { color: var(--gl-accent-txt); }

  .glance[data-active="task"]   .glance-band[data-band="task"]   .flow-icon,
  .glance[data-active="action"] .glance-band[data-band="action"] .flow-icon,
  .glance[data-active="result"] .glance-band[data-band="result"] .flow-icon { color: var(--gl-accent-txt); }

  .glance[data-active="task"]   .glance-band[data-band="task"]   .flow-card,
  .glance[data-active="action"] .glance-band[data-band="action"] .flow-card,
  .glance[data-active="result"] .glance-band[data-band="result"] .flow-card {
    border-color: var(--gl-accent);
    box-shadow: inset 0 0 0 1px var(--gl-accent);
  }

  /* ── Side by side on wide panels ── */
  @container glance (min-width: 860px) {
    .glance-body { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    .glance-col--star { padding: 24px 28px 26px 24px; }
    .glance-col--flow {
      padding: 24px 24px 26px;
      border-top: 0;
      border-left: 1px solid var(--border);
    }
  }

  @media (max-width: 520px) {
    .glance-meta { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .star-row, .star-row::before, .star-row::after,
    .star-body, .band-label, .flow-card, .flow-icon { transition: none; }
  }
</style>

/* NavStrip at bottom of every section */
function navStripHTML(active) {
  const idx = NAV_ORDER.indexOf(active);
  const prevId = idx > 0 ? NAV_ORDER[idx-1] : null;
  const nextId = idx < NAV_ORDER.length - 1 ? NAV_ORDER[idx+1] : null;
  const prev = prevId
    ? `<button class="prev" data-nav="${prevId}">← ${esc(SECTION_META[prevId].label)}</button>`
    : `<span></span>`;
  const next = nextId
    ? `<button class="next" data-nav="${nextId}">
         <div class="next-label">Next up</div>
         <div class="next-title">${esc(SECTION_META[nextId].label)} →</div>
       </button>`
    : '';
  return `<div class="navstrip">${prev}${next}</div>`;
}

/* At-a-glance, STAR rows act as tabs over the process panel. */
function setupGlance() {
  const gl = contentInner.querySelector('.glance');
  if (!gl) return;

  const tabs  = Array.from(gl.querySelectorAll('[role="tab"]'));
  const panel = gl.querySelector('[role="tabpanel"]');
  const phase = gl.querySelector('.glance-phase');
  if (!tabs.length || !panel) return;

  function select(tab, moveFocus) {
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    gl.setAttribute('data-active', tab.dataset.star);
    panel.setAttribute('aria-labelledby', tab.id);
    if (phase) phase.textContent = tab.dataset.phase;
    if (moveFocus) tab.focus();
  }

  tabs.forEach((tab, i) => {
    tab.addEventListener('click', () => select(tab, false));
    tab.addEventListener('keydown', (e) => {
      let next = null;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
      else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = tabs[(i - 1 + tabs.length) % tabs.length];
      else if (e.key === 'Home') next = tabs[0];
      else if (e.key === 'End') next = tabs[tabs.length - 1];
      if (next) { e.preventDefault(); select(next, true); }
    });
  });
}

function setupImgFade() {
  contentInner.querySelectorAll('img:not(.reveal):not(.avatar-circle)').forEach(function(img) {
    if (img.complete && img.naturalWidth > 0) {
      img.classList.add('is-loaded');
    } else {
      img.addEventListener('load',  function() { this.classList.add('is-loaded'); }, { once: true });
      img.addEventListener('error', function() { this.classList.add('is-loaded'); }, { once: true });
    }
  });
}

function setupReveals() {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }

  const section = contentInner.querySelector('.section');
  if (!section) return;

  const els = Array.from(section.children);
  els.forEach(el => el.classList.add('reveal'));

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    els.forEach(el => el.classList.add('is-in'));
    return;
  }

  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-in');
        revealObserver.unobserve(entry.target);
      }
    });
  }, {
    root: contentPane,
    rootMargin: '0px 0px -8% 0px',
    threshold: 0.01,
  });

  requestAnimationFrame(() => {
    const paneBottom = contentPane.getBoundingClientRect().bottom;
    let staggerIdx = 0;
    els.forEach(el => {
      const top = el.getBoundingClientRect().top;
      if (top < paneBottom) {
        const delay = Math.min(staggerIdx * 55, 280);
        el.style.transitionDelay = `${delay}ms`;
        el.classList.add('is-in');
        setTimeout(() => { el.style.transitionDelay = ''; }, delay + 600);
        staggerIdx++;
      } else {
        revealObserver.observe(el);
      }
    });
  });
}

/* ── Poster lightbox ── */
(function () {
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'A0 poster zoomed');
  const img = document.createElement('img');
  const closeBtn = document.createElement('button');
  closeBtn.className = 'lightbox-close';
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.innerHTML = '✕';
  overlay.appendChild(img);
  overlay.appendChild(closeBtn);
  document.body.appendChild(overlay);

  function open(src, alt) {
    img.src = src; img.alt = alt;
    overlay.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }
  function close() {
    overlay.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  // delegated, works even after section re-render
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('#poster-btn');
    if (!btn) return;
    const i = btn.querySelector('img');
    if (i) open(i.src, i.alt);
  });
})();

function setupCarousel() {
  const root = document.getElementById('hifi-carousel');
  if (!root) return;

  const track   = root.querySelector('.hifi-track');
  const wrap    = root.querySelector('.hifi-track-wrap');
  const slides  = Array.from(root.querySelectorAll('.hifi-slide'));
  const dots    = Array.from(root.querySelectorAll('.hifi-dot'));
  const caption = root.querySelector('.hifi-caption');
  const counter = root.querySelector('.hifi-current');
  const prevBtn = root.querySelector('.hifi-prev');
  const nextBtn = root.querySelector('.hifi-next');
  const total   = slides.length;
  let index = 0;

  function update() {
    const slide = slides[index];
    if (!slide) return;
    const slideCenter = slide.offsetLeft + slide.offsetWidth / 2;
    const stageCenter = wrap.clientWidth / 2;
    track.style.transform = `translateX(${stageCenter - slideCenter}px)`;
    slides.forEach((s, i) => s.classList.toggle('is-active', i === index));
    dots.forEach((d, i) => d.classList.toggle('is-active', i === index));
    if (caption) caption.textContent = slide.dataset.title || '';
    if (counter) counter.textContent = String(index + 1).padStart(2, '0');
  }

  function go(next) { index = (next + total) % total; update(); }

  prevBtn && prevBtn.addEventListener('click', () => go(index - 1));
  nextBtn && nextBtn.addEventListener('click', () => go(index + 1));
  dots.forEach((d, i) => d.addEventListener('click', () => go(i)));

  // keyboard nav when carousel is focused
  root.tabIndex = 0;
  root.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft')  { e.preventDefault(); go(index - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); go(index + 1); }
  });

  // swipe support
  let startX = 0, startT = 0;
  wrap.addEventListener('pointerdown', (e) => { startX = e.clientX; startT = Date.now(); });
  wrap.addEventListener('pointerup', (e) => {
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 40 && Date.now() - startT < 500) go(index + (dx < 0 ? 1 : -1));
  });

  // recenter once images are sized + on resize
  const ro = new ResizeObserver(() => update());
  ro.observe(wrap);
  requestAnimationFrame(update);
  slides.forEach(s => {
    const img = s.querySelector('img');
    if (img && !img.complete) img.addEventListener('load', update, { once: true });
  });
}

function buildSidebar() {
  navGroupsEl.innerHTML = GROUPS.map(g => `
    <div class="nav-group">
      <div class="nav-group-label">${esc(g.group)}</div>
      ${g.ids.map(id => `
        <button class="nav-item" data-nav="${id}" type="button">
          <span class="nav-dot" aria-hidden="true"></span>
          <span class="nav-label">${esc(SECTION_META[id].label)}</span>
        </button>
      `).join('')}
    </div>
  `).join('');
}

function updateNavStates() {
  const activeIdx = NAV_ORDER.indexOf(active);
  navGroupsEl.querySelectorAll('.nav-item').forEach(btn => {
    const id = btn.dataset.nav;
    const idx = NAV_ORDER.indexOf(id);
    btn.classList.toggle('is-active', id === active);
    btn.classList.toggle('is-done', idx < activeIdx);
    if (id === active) btn.setAttribute('aria-current', 'true');
    else btn.removeAttribute('aria-current');
  });
}

function updateProgress() {
  const pct = PROGRESS_PCT[active] || 0;
  progressBar.style.width = pct + '%';
  progressPct.textContent = pct + '%';
}

function render(id) {
  if (!CONTENT[id]) return;
  active = id;

  const html = `
    <section class="section is-visible" id="section-${id}" aria-labelledby="title-${id}">
      ${CONTENT[id]()}
      ${navStripHTML(id)}
    </section>
  `;
  contentInner.innerHTML = html;
  contentInner.setAttribute('data-section', id);
  contentPane.scrollTop = 0;
  setupReveals();
  setupCarousel();
  setupImgFade();
  setupGlance();
  updateNavStates();
  updateProgress();

  // keep URL clean, no hash
  if (history.replaceState) {
    history.replaceState(null, '', window.location.pathname);
  }

  // close mobile sidebar if open
  closeSidebar();
}

function openSidebar() {
  sidebarEl.classList.add('is-open');
  scrimEl.classList.add('is-open');
  menuBtn.setAttribute('aria-expanded', 'true');
}
function closeSidebar() {
  sidebarEl.classList.remove('is-open');
  scrimEl.classList.remove('is-open');
  menuBtn.setAttribute('aria-expanded', 'false');
}

/* ───────────────────────────────────────
   EVENTS
─────────────────────────────────────── */
document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    render(navBtn.dataset.nav);
  }
});

menuBtn.addEventListener('click', () => {
  if (sidebarEl.classList.contains('is-open')) closeSidebar();
  else openSidebar();
});
scrimEl.addEventListener('click', closeSidebar);

document.addEventListener('keydown', (e) => {
  // skip if typing in a field
  if (e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  const idx = NAV_ORDER.indexOf(active);
  if (e.key === 'ArrowRight' && idx < NAV_ORDER.length - 1) {
    e.preventDefault();
    render(NAV_ORDER[idx + 1]);
  } else if (e.key === 'ArrowLeft' && idx > 0) {
    e.preventDefault();
    render(NAV_ORDER[idx - 1]);
  } else if (e.key === 'Escape') {
    closeSidebar();
  }
});

/* ───────────────────────────────────────
   INIT
─────────────────────────────────────── */
buildSidebar();

const hashId = (location.hash || '').replace('#', '');
render(NAV_ORDER.includes(hashId) ? hashId : 'intro');
</script>

<script>
/* ── Custom cursor, skip on touch devices ── */
(function() {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const ring = document.createElement('div'); ring.id = 'cur-ring'; document.body.appendChild(ring);
  const dot  = document.createElement('div'); dot.id  = 'cur-dot';  document.body.appendChild(dot);
  let mx=0,my=0,cx=0,cy=0;
  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
  (function loop(){ cx+=(mx-cx)*.14; cy+=(my-cy)*.14; ring.style.left=mx+'px'; ring.style.top=my+'px'; dot.style.left=cx+'px'; dot.style.top=cy+'px'; requestAnimationFrame(loop); })();
})();

/* ── Pixel dissolve on images ── */
function pixelReveal(el) {
  const wrap = el.parentElement;
  const pos = getComputedStyle(wrap).position;
  if (pos === 'static') wrap.style.position = 'relative';
  const canvas = document.createElement('canvas');
  canvas.className = 'px-canvas';
  wrap.appendChild(canvas);
  let done = false;
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting && !done) { done=true; obs.disconnect(); runReveal(canvas,'#F7F6F3'); } });
  }, { threshold: 0.15 });
  obs.observe(wrap);
}
function runReveal(canvas, fill) {
  const W = canvas.parentElement.offsetWidth;
  const H = canvas.parentElement.offsetHeight;
  if (!W || !H) { canvas.remove(); return; }
  canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const BS = 14, cols=Math.ceil(W/BS), rows=Math.ceil(H/BS), total=cols*rows;
  const blocks=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) blocks.push([c,r]);
  for(let i=blocks.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [blocks[i],blocks[j]]=[blocks[j],blocks[i]]; }
  ctx.fillStyle=fill; ctx.fillRect(0,0,W,H);
  const batch=Math.ceil(total/24); let idx=0;
  function step(){
    const end=Math.min(idx+batch,total);
    for(let i=idx;i<end;i++){ const[c,r]=blocks[i]; ctx.clearRect(c*BS,r*BS,BS,BS); }
    idx=end;
    if(idx<total) requestAnimationFrame(step);
    else { canvas.style.transition='opacity .2s'; canvas.style.opacity='0'; setTimeout(()=>canvas.remove(),220); }
  }
  setTimeout(()=>requestAnimationFrame(step),60);
}
if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
  document.querySelectorAll('img').forEach(img => {
    if (img.complete) pixelReveal(img);
    else img.addEventListener('load', () => pixelReveal(img), {once:true});
  });
}

/* ── Scroll reveal sections ── */
const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('visible'); revObs.unobserve(e.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('section, .section, [data-section], h2, h3, .card, .finding, .stat').forEach(el => {
  el.classList.add('scroll-reveal'); revObs.observe(el);
});



/* ── Scroll word highlights ── */
const hlObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    const words = e.target.querySelectorAll('.hl-word');
    if(e.isIntersecting) words.forEach((w,i) => setTimeout(()=>w.classList.add('lit'), i*100));
    else words.forEach(w=>w.classList.remove('lit'));
  });
}, { threshold: 0.5 });
document.querySelectorAll('p, li, .body-text, .stack-body').forEach(el => { if(el.querySelectorAll('.hl-word').length) hlObs.observe(el); });
</script>
