<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tribes: Designing a gesture-led social MVP</title>
<meta name="description" content="A case study on designing an MVP for Tribes, a personalised social app built around gesture-based interactions and curated content.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ───────────────────────────────────────
     TOKENS, Tribes dark mode, AAA contrast
     Brand: purple #b44fe0, cyan #5ac4d4
  ─────────────────────────────────────── */
  :root {
    --bg:       #1b1a17;
    --bg-2:     #252420;
    --bg-page:  #141311;
    --ink:      #f4f2ec;   /* 14.3:1 on --bg, AAA */
    --ink-mid:  #d8d3c8;   /* 10.4:1 on --bg, AAA */
    --ink-light:#b8b3a8;   /* 7.4:1 on --bg, AAA normal text */
    --border:   rgba(244,242,236,0.12);
    --border-strong: rgba(244,242,236,0.26);
    --mute:     rgba(244,242,236,0.36);
    --green:    #7ed49a;
    --red:      #ff8a8a;

    /* Tribes brand palette */
    --accent:       #b44fe0;   /* purple, headings, active states (large-text AAA) */
    --accent-deep:  #5ac4d4;   /* cyan, pills, small accents (AAA w/ --bg text) */
    --accent-tint:  rgba(180,79,224,0.14);

    --font-mono: 'Familjen Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;

    --topnav-h: 56px;
    --sidebar-w: 260px;
    --content-max: 900px;
  }

  /* ───────────────────────────────────────
     RESET / BASE
  ─────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-2); }
  ::-webkit-scrollbar-thumb { background: var(--mute); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(244,242,236,0.5); }

  /* ───────────────────────────────────────
     APP SHELL
  ─────────────────────────────────────── */
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  .topnav {
    height: var(--topnav-h);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: relative;
    z-index: 20;
  }
  .topnav .crumb-work { font-size: 14px; color: var(--ink-light); }
  .topnav .crumb-sep  { font-size: 14px; color: var(--border-strong); margin: 0 10px; }
  .topnav .crumb-now  { font-size: 14px; font-weight: 500; color: var(--ink); }
  .topnav .topnav-spacer { flex: 1; }
  .topnav .topnav-links { display: flex; gap: 28px; }
  .topnav .topnav-links a { font-size: 14px; color: var(--ink-light); }
  .topnav .topnav-links a:hover { color: var(--ink); }
  .topnav .menu-btn {
    display: none;
    width: 40px; height: 40px;
    margin-left: auto;
    align-items: center; justify-content: center;
    border-radius: 8px;
  }
  .topnav .menu-btn:hover { background: var(--bg-2); }
  .topnav .menu-btn svg { width: 18px; height: 18px; }

  .layout {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w);
    flex: 0 0 auto;
    border-right: 1px solid var(--border);
    background: var(--bg);
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }
  .sidebar-head {
    padding: 22px 22px 18px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-head .kicker { font-size: 13px; color: var(--ink); margin-bottom: 4px; letter-spacing: .01em; }
  .sidebar-head .title  { font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: -.005em; }

  .progress { padding: 14px 22px 4px; }
  .progress-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .progress-row span { font-size: 12px; color: var(--ink); font-weight: 500; }
  .progress-row .pct { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
  .progress-track {
    height: 8px; background: var(--border); border-radius: 99px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0;
    background: var(--accent);
    border-radius: 99px;
  }

  .nav-groups { padding: 8px 0 24px; }
  .nav-group { margin-top: 14px; }
  .nav-group-label {
    font-size: 12px; font-weight: 600;
    color: var(--ink-light);
    padding: 0 22px;
    margin-bottom: 4px;
    letter-spacing: .02em;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 22px;
    border-right: 2px solid transparent;
    background: transparent;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .nav-item:hover { background: var(--accent-tint); }
  .nav-item:hover .nav-label { color: var(--ink); }
  .nav-item:hover .nav-dot { border-color: var(--ink); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .nav-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    background: transparent;
    border: 1.5px solid var(--border-strong);
  }
  .nav-label {
    font-size: 13.5px;
    font-weight: 400;
    color: var(--ink-mid);
    line-height: 1.35;
  }

  .nav-item.is-done .nav-dot {
    background: var(--mute);
    border-color: var(--mute);
  }
  .nav-item.is-done .nav-label { color: var(--ink-light); }

  .nav-item.is-active {
    background: var(--accent-tint);
    border-right-color: var(--accent);
  }
  .nav-item.is-active .nav-dot {
    background: var(--accent);
    border-color: var(--accent);
  }
  .nav-item.is-active .nav-label {
    color: var(--ink);
    font-weight: 600;
  }

  /* Content pane */
  .content {
    flex: 1 1 auto;
    overflow-y: auto;
    background: var(--bg);
    min-width: 0;
  }
  .content-inner {
    max-width: var(--content-max);
    margin: 0 auto;
    padding: 48px 56px 96px;
  }
  .content-inner[data-section="intro"],
  .content-inner[data-section="brief"],
  .content-inner[data-section="story"],
  .content-inner[data-section="research"],
  .content-inner[data-section="findings"],
  .content-inner[data-section="principles"],
  .content-inner[data-section="ideation"],
  .content-inner[data-section="testing"],
  .content-inner[data-section="hifi"],
  .content-inner[data-section="centrenav"],
  .content-inner[data-section="final"],
  .content-inner[data-section="reflection"] { max-width: 1080px; }

  .section { display: none; }
  .section.is-visible { display: block; }

  /* ───────────────────────────────────────
     CONTENT ATOMS
  ─────────────────────────────────────── */
  .eyebrow {
    font-size: 14px;
    color: var(--ink-light);
    margin-bottom: 14px;
  }
  h1.section-title {
    font-size: 37px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -.03em;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .accent-pink { color: var(--accent); }
  .lede {
    font-size: 19.5px;
    line-height: 1.6;
    color: var(--ink-mid);
    margin-bottom: 32px;
  }
  h2.sub-head {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -.02em;
    color: var(--ink);
    margin: 0 0 14px;
  }
  h2.sub-head span { color: var(--ink-light); }
  .rule { height: 1px; background: var(--border); margin: 32px 0; border: 0; }
  .rule-accent { height: 2px; background: var(--accent); margin: 32px 0; border: 0; width: 60px; }
  .section-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 14px;
  }
  .section-label .sublabel {
    font-weight: 400;
    font-size: 11px;
    text-transform: none;
    letter-spacing: 0;
  }

  .card {
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
  }
  .card.is-muted { background: var(--bg-2); }
  .card-h { font-size: 15.5px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .card-body { font-size: 15.5px; color: var(--ink-mid); line-height: 1.6; }
  .card-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-light);
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .list-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
    background: var(--bg);
  }
  .list-row {
    display: grid;
    grid-template-columns: 40px 1fr;
    gap: 12px;
    padding: 16px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .list-row:last-child { border-bottom: 0; }
  .list-row.is-mine { background: var(--accent-tint); grid-template-columns: 40px 1fr auto; }
  .list-row .icon-box {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px; flex-shrink: 0;
  }
  .list-row.is-mine .icon-box { background: var(--accent); border-color: var(--accent); }
  .list-row .icon-box svg rect { fill: rgba(244,242,236,0.5); }
  .list-row.is-mine .icon-box svg rect { fill: #fff; }
  .list-row .row-title { font-size: 16.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .list-row .row-body { font-size: 15.5px; color: var(--ink-mid); line-height: 1.6; }
  .list-row .row-pill {
    font-size: 11px; font-weight: 600;
    background: var(--accent-deep); color: var(--bg);
    padding: 3px 9px; border-radius: 20px;
    white-space: nowrap; margin-top: 3px;
    letter-spacing: .04em;
    align-self: start;
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .grid-gap-lg { gap: 16px; }

  .img-ph {
    background: var(--bg-2);
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-light);
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .avatars { display: flex; gap: 10px; align-items: flex-start; }
  .avatar { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .avatar-circle {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--ink-mid);
  }
  .avatar.is-me .avatar-circle { background: var(--accent-deep); color: var(--bg); border-color: var(--accent-deep); }
  .avatar-name { font-size: 13px; color: var(--ink-mid); }
  .avatar.is-me .avatar-name { color: var(--ink); font-weight: 600; }

  .prose-p {
    font-size: 17.5px; color: var(--ink-mid); line-height: 1.75;
    margin-bottom: 28px;
  }
  .prose-p:last-child { margin-bottom: 0; }

  .pm-check {
    display: flex; gap: 8px; margin-bottom: 8px;
    font-size: 15.5px; color: var(--ink-mid); line-height: 1.55;
  }
  .pm-check .sym { font-size: 15.5px; margin-top: -1px; flex: 0 0 12px; font-weight: 700; }
  .pm-check.is-plus .sym { color: var(--accent-deep); }
  .pm-check.is-minus .sym { color: var(--accent); }

  .quote-card {
    padding: 16px 18px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
  }
  .quote-card .q { font-size: 16.5px; color: var(--ink); line-height: 1.6; font-weight: 500; }
  .quote-card cite {
    display: block;
    margin-top: 8px;
    font-size: 13px;
    font-style: normal;
    color: var(--ink-light);
    letter-spacing: .04em;
  }

  .termlist { display: flex; flex-direction: column; margin-bottom: 28px; }
  .termlist-item {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 32px;
    padding: 20px 0;
    border-top: 1px solid var(--border);
    align-items: start;
  }
  .termlist-item:last-child { border-bottom: 1px solid var(--border); }
  .termlist-term {
    font-size: 15.5px; font-weight: 600;
    color: var(--ink);
    letter-spacing: -.005em;
  }
  .termlist-def {
    font-size: 17.5px; line-height: 1.75;
    color: var(--ink);
  }
  @media (max-width: 700px) {
    .termlist-item { grid-template-columns: 1fr; gap: 6px; padding: 16px 0; }
  }

  /* ───────────────────────────────────────
     BRIEF, typographic product layout
  ─────────────────────────────────────── */
  .brief-products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 40px;
    margin-bottom: 40px;
  }
  .brief-product-name {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 3px 10px;
    margin-bottom: 12px;
  }
  .brief-product-body {
    font-size: 17.5px;
    line-height: 1.75;
    color: var(--ink);
  }
  .principle-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    background: var(--bg-2);
    color: var(--ink);
    margin-bottom: 14px;
  }

  .attention-block {
    background: var(--bg-2);
    border-radius: 12px;
    padding: 22px 26px;
    margin-bottom: 28px;
  }
  .attention-block-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .attention-block-body {
    font-size: 17.5px;
    line-height: 1.7;
    color: var(--ink);
  }
  .attention-block-body p { margin-bottom: 24px; }
  .attention-block-body p:last-child { margin-bottom: 0; }
  .attention-block-body ul { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

  /* ───────────────────────────────────────
     BY THE NUMBERS
  ─────────────────────────────────────── */
  .by-numbers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 16px;
  }
  .by-numbers-item { border-top: 2px solid var(--accent); padding-top: 8px; }
  .by-numbers-num {
    font-size: 65px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  .by-numbers-lbl {
    font-size: 15.5px;
    color: var(--ink);
    line-height: 1.5;
    margin-top: 4px;
  }
  @media (max-width: 900px) {
    .by-numbers { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .by-numbers-num { font-size: 35px; }
  }
  @media (max-width: 480px) {
    .by-numbers { grid-template-columns: 1fr; }
  }

  /* Flow step */
  .flow-step {
    padding: 14px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: center;
    background: var(--bg);
  }
  .flow-step .num {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--bg-2); border: 1px solid var(--border);
    margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--ink);
  }
  .flow-step .label { font-size: 15.5px; font-weight: 600; color: var(--ink); }

  /* Participant card */
  .participant-card {
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    text-align: center;
    min-width: 100px;
  }
  .participant-card .p { font-size: 15.5px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .participant-card .d { font-size: 13px; color: var(--ink-mid); }
  .participant-card .r { font-size: 13px; color: var(--ink-light); }

  /* Screen card (Feedback & Testing) */
  .screen-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .screen-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    padding: 18px 18px 16px;
    display: flex;
    flex-direction: column;
  }
  .screen-card.is-priority {
    border: 1.5px solid var(--accent);
    background: var(--accent-tint);
  }
  .screen-card .ph {
    height: 120px;
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    background: var(--bg-2);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    color: var(--ink-light);
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .screen-card .t { font-size: 16.5px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
  .screen-card ul { list-style: disc; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .screen-card li { font-size: 14px; line-height: 1.55; color: var(--ink-mid); }
  .priority-legend {
    font-size: 13px;
    color: var(--ink-light);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .priority-legend .chip {
    display: inline-block;
    width: 12px; height: 12px; border-radius: 3px;
    border: 1.5px solid var(--accent);
    background: var(--accent-tint);
  }
  @media (max-width: 900px) {
    .screen-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .screen-grid { grid-template-columns: 1fr; }
  }

  /* Gesture group (Centre Navigation) */
  .gesture-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 28px;
  }
  .gesture-group-item {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    background: var(--bg);
  }
  .gesture-group-item .ttl {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 12px;
  }
  .gesture-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .gesture-tag {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
  }
  @media (max-width: 700px) {
    .gesture-group { grid-template-columns: 1fr; }
  }

  /* Nav strip (next/prev) */
  .navstrip {
    border-top: 1px solid var(--border);
    padding-top: 24px;
    margin-top: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .navstrip .prev { font-size: 13px; color: var(--ink-light); }
  .navstrip .prev:hover { color: var(--ink); }
  .navstrip .next { text-align: right; }
  .navstrip .next .next-label { font-size: 11.5px; color: var(--ink-light); margin-bottom: 3px; }
  .navstrip .next .next-title { font-size: 14px; font-weight: 600; color: var(--ink); }

  /* ───────────────────────────────────────
     RESPONSIVE
  ─────────────────────────────────────── */
  @media (max-width: 900px) {
    .content-inner { padding: 36px 32px 80px; }
    h1.section-title { font-size: 30.5px; }
    .lede { font-size: 15.5px; }
    .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; }
    .brief-products { grid-template-columns: 1fr; row-gap: 28px; column-gap: 0; }
  }
  @media (max-width: 760px) {
    :root { --sidebar-w: 240px; --topnav-h: 52px; }
    .topnav { padding: 0 18px; }
    .topnav .topnav-links { display: none; }
    .topnav .menu-btn { display: flex; }

    .sidebar {
      position: fixed;
      top: var(--topnav-h);
      left: 0;

<link rel="stylesheet" href="design-system.css">
<style>
  /* design-system.css is linked AFTER this page own <style>, so its :root
     wins the cascade, the token has to be re-asserted here or the page
     silently falls back to JetBrains Mono. Scoped to this page: index.html
     keeps the old face until it is migrated too.
     The name stays --font-mono because design-system.css references it by
     that name in six places. */
  :root{ --font-mono: 'Familjen Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }

  /* ───────────────────────────────────────
     AT A GLANCE
     STAR summary + design process flow.
     Self-contained: page tokens only, no new deps.
     Container queries drive the two layout switches:
       .glance     ≥860px → STAR | process side by side
       .glance-col--flow ≥340px → horizontal node flow
     Below either threshold it degrades to stacked /
     vertical timeline, which is also the no-support base.
  ─────────────────────────────────────── */
  .glance {
    --gl-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
    --gl-accent:     var(--accent);       /* purple, graphic accent */
    --gl-accent-txt: var(--accent-deep);  /* cyan, AAA small text on --bg */
    --gl-rail:       var(--border-strong);

    container: glance / inline-size;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    overflow: hidden;
    margin: 0 0 32px;
  }

  /* ── Terminal chrome bar ── */
  .glance-chrome {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-2);
    font-family: var(--gl-mono);
    font-size: 11.5px;
    letter-spacing: .02em;
    color: var(--ink-light);
  }
  .glance-led {
    width: 7px; height: 7px;
    flex: none;
    border-radius: 50%;
    background: var(--gl-accent);
  }
  .glance-num  { font-weight: 700; color: var(--ink-mid); }
  .glance-path { font-weight: 600; color: var(--gl-accent-txt); }
  .glance-meta { margin-left: auto; }

  /* ── Body ── */
  .glance-body {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }
  .glance-col--star { padding: 22px 20px 24px; }
  .glance-col--flow {
    container: flow / inline-size;
    padding: 22px 20px 24px;
    background: var(--bg-2);
    border-top: 1px solid var(--border);
  }
  .glance-col--flow:focus-visible { outline: 2px solid var(--gl-accent); outline-offset: -2px; }
  .glance-h {
    font-family: var(--gl-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-light);
  }

  /* ── STAR, clickable rows that drive the process panel ── */
  .glance-star { display: grid; gap: 2px; }
  .star-row {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 3px;
    width: calc(100% + 22px);
    margin-inline: -11px;
    padding: 10px 30px 11px 13px;
    border: 0;
    border-radius: 8px;
    background: none;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    transition: background-color .2s var(--ease);
  }
  .star-row::before {              /* selected spine */
    content: '';
    position: absolute;
    left: 2px; top: 10px; bottom: 10px;
    width: 2px;
    border-radius: 2px;
    background: var(--gl-accent);
    opacity: 0;
    transition: opacity .2s var(--ease);
  }
  .star-row::after {               /* clickable affordance */
    content: '';
    position: absolute;
    right: 13px; top: 16px;
    width: 5px; height: 5px;
    border-top: 1.4px solid currentColor;
    border-right: 1.4px solid currentColor;
    transform: rotate(45deg);
    color: var(--ink-light);
    opacity: .45;
    transition: opacity .2s var(--ease), color .2s var(--ease);
  }
  .star-row:hover { background: var(--bg-2); }
  .star-row:hover::after { opacity: 1; }
  .star-row:focus-visible { outline: 2px solid var(--gl-accent); outline-offset: 1px; }
  .star-row[aria-selected="true"] { background: var(--bg-2); }
  .star-row[aria-selected="true"]::before { opacity: 1; }
  .star-row[aria-selected="true"]::after { opacity: 1; color: var(--gl-accent); }
  .star-row[aria-selected="true"] .star-body { color: var(--ink); }

  .star-label {
    display: block;
    font-family: var(--gl-mono);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--gl-accent-txt);
  }
  .star-body {
    display: block;
    font-size: 14.5px;
    line-height: 1.62;
    color: var(--ink-mid);
    max-width: 66ch;
    transition: color .2s var(--ease);
  }
  @container glance (min-width: 560px) {
    .star-row { grid-template-columns: 88px minmax(0, 1fr); gap: 16px; }
    .star-label { padding-top: 3px; }
  }

  /* ── Skill tags ── */
  .glance-tags {
    list-style: none;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px dashed var(--border-strong);
  }
  .glance-tags li {
    font-family: var(--gl-mono);
    font-size: 10.5px;
    line-height: 1.4;
    color: var(--ink-light);
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 8px;
  }

  /* ── Process panel ── */
  .glance-panel-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
  }
  .glance-phase {
    margin-left: auto;
    font-family: var(--gl-mono);
    font-size: 10.5px;
    letter-spacing: .04em;
    color: var(--ink-light);
    white-space: nowrap;
  }

  .glance-bands { display: grid; gap: 18px; }
  .glance-band { display: grid; gap: 8px; }
  .band-label {
    display: flex;
    align-items: center;
    gap: 9px;
    font-family: var(--gl-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-light);
    transition: color .2s var(--ease);
  }
  .band-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .band-cards {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  @container flow (min-width: 300px) { .band-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @container flow (min-width: 430px) { .band-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .flow-card {
    display: grid;
    gap: 2px;
    padding: 11px 11px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg);
    transition: border-color .22s var(--ease), box-shadow .22s var(--ease);
  }
  .flow-icon {
    display: block;
    margin-bottom: 5px;
    color: var(--ink-light);
    transition: color .22s var(--ease);
  }
  .flow-icon svg { width: 18px; height: 18px; }
  .flow-label {
    font-size: clamp(11px, 2.9cqi, 12.5px);
    font-weight: 600;
    line-height: 1.3;
    color: var(--ink);
    hyphens: auto;                 /* safety net for long single-word labels */
    overflow-wrap: break-word;
  }
  .flow-note {
    font-size: clamp(10px, 2.5cqi, 11px);
    line-height: 1.35;
    color: var(--ink-light);
  }

  /* Selected STAR row lights its band */
  .glance[data-active="task"]   .glance-band[data-band="task"]   .band-label,
  .glance[data-active="action"] .glance-band[data-band="action"] .band-label,
  .glance[data-active="result"] .glance-band[data-band="result"] .band-label { color: var(--gl-accent-txt); }

  .glance[data-active="task"]   .glance-band[data-band="task"]   .flow-icon,
  .glance[data-active="action"] .glance-band[data-band="action"] .flow-icon,
  .glance[data-active="result"] .glance-band[data-band="result"] .flow-icon { color: var(--gl-accent-txt); }

  .glance[data-active="task"]   .glance-band[data-band="task"]   .flow-card,
  .glance[data-active="action"] .glance-band[data-band="action"] .flow-card,
  .glance[data-active="result"] .glance-band[data-band="result"] .flow-card {
    border-color: var(--gl-accent);
    box-shadow: inset 0 0 0 1px var(--gl-accent);
  }

  /* ── Side by side on wide panels ── */
  @container glance (min-width: 860px) {
    .glance-body { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
    .glance-col--star { padding: 24px 28px 26px 24px; }
    .glance-col--flow {
      padding: 24px 24px 26px;
      border-top: 0;
      border-left: 1px solid var(--border);
    }
  }

  @media (max-width: 520px) {
    .glance-meta { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .star-row, .star-row::before, .star-row::after,
    .star-body, .band-label, .flow-card, .flow-icon { transition: none; }
  }
</style>

<script>
/* ───────────────────────────────────────
   DATA
─────────────────────────────────────── */
const NAV_ORDER = [
  'intro','brief','story',
  'research','findings',
  'principles','ideation','testing','hifi','centrenav',
  'final','reflection',
];

const SECTION_META = {
  intro:      { label:'Intro',              group:'Overview' },
  brief:      { label:'Project Brief',      group:'Overview' },
  story:      { label:'How I Got Here',     group:'Overview' },
  research:   { label:'Research Approach',  group:'Research' },
  findings:   { label:'Findings',           group:'Research' },
  principles: { label:'Design Principles',  group:'Design'   },
  ideation:   { label:'Ideation',           group:'Design'   },
  testing:    { label:'Feedback & Testing', group:'Design'   },
  hifi:       { label:'Hi-fidelity',        group:'Design'   },
  centrenav:  { label:'Centre Navigation',  group:'Design'   },
  final:      { label:'Final',              group:'Outcome'  },
  reflection: { label:'Reflection',         group:'Outcome'  },
};

const GROUPS = [
  { group:'Overview', ids:['intro','brief','story'] },
  { group:'Research', ids:['research','findings'] },
  { group:'Design',   ids:['principles','ideation','testing','hifi','centrenav'] },
  { group:'Outcome',  ids:['final','reflection'] },
];

const PROGRESS_PCT = NAV_ORDER.reduce((acc, id, i) => {
  acc[id] = Math.round((i / (NAV_ORDER.length - 1)) * 100);
  return acc;
}, {});

/* ───────────────────────────────────────
   HELPERS
─────────────────────────────────────── */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const dotsSvg = () => `
  <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
    <rect x="1" y="1" width="4.5" height="4.5" rx="1"/>
    <rect x="7.5" y="1" width="4.5" height="4.5" rx="1"/>
    <rect x="1" y="7.5" width="4.5" height="4.5" rx="1"/>
    <rect x="7.5" y="7.5" width="4.5" height="4.5" rx="1"/>
  </svg>`;

function listCardHTML(items) {
  const rows = items.map(it => {
    const mine = it.mine ? ' is-mine' : '';
    const pill = it.mine ? `<span class="row-pill">My focus</span>` : '';
    return `
      <div class="list-row${mine}">
        <div class="icon-box">${dotsSvg()}</div>
        <div>
          <div class="row-title">${esc(it.title)}</div>
          <div class="row-body">${esc(it.body)}</div>
        </div>
        ${pill}
      </div>`;
  }).join('');
  return `<div class="list-card">${rows}</div>`;
}

function callout(title, bodyHTML) {
  const t = title ? `<div class="attention-block-title">${esc(title)}</div>` : '';
  return `<div class="attention-block">${t}<div class="attention-block-body">${bodyHTML}</div></div>`;
}

function termlistHTML(items) {
  const rows = items.map(it => `
    <div class="termlist-item">
      <div class="termlist-term">${esc(it.title)}</div>
      <div class="termlist-def">${esc(it.body)}</div>
    </div>`).join('');
  return `<div class="termlist">${rows}</div>`;
}

function quote(q, speaker) {
  return `
    <div class="quote-card" style="margin-bottom:28px;">
      <p class="q">&ldquo;${esc(q)}&rdquo;</p>
      ${speaker ? `<cite>${esc(speaker)}</cite>` : ''}
    </div>`;
}

function rule() { return `<hr class="rule" />`; }
function ruleAccent() { return `<hr class="rule-accent" />`; }

function sLabel(text, sub) {
  const s = sub ? ` <span class="sublabel">${esc(sub)}</span>` : '';
  return `<div class="section-label">${esc(text)}${s}</div>`;
}

function img(label, h = 140) {
  return `<div class="img-ph" style="height:${h}px; margin-bottom: 16px;">${esc(label)}</div>`;
}

/* At-a-glance icons, inline so they inherit currentColor and tint with the
   accent when a band is active. Existing SVGs in /Icon_assets have baked-in
   fills and would not theme across the light and dark case study pages. */
const GL_ICON = {
  search: '<circle cx="7.4" cy="7.4" r="4.6"/><path d="M10.9 10.9L15.2 15.2"/>',
  target: '<circle cx="9" cy="9" r="6.3"/><circle cx="9" cy="9" r="2.4"/>',
  bulb:   '<circle cx="9" cy="7.3" r="4.3"/><path d="M6.9 13h4.2M7.5 15.4h3"/>',
  window: '<rect x="2.6" y="2.6" width="12.8" height="12.8" rx="1.6"/><path d="M2.6 6.4h12.8"/><circle cx="4.9" cy="4.5" r=".7"/>',
  check:  '<circle cx="9" cy="9" r="6.3"/><path d="M6 9.2l2.2 2.2 3.9-4.6"/>',
  arrow:  '<path d="M3.4 14.6L14.6 3.4"/><path d="M7.6 3.4h7v7"/>',
  stack:  '<rect x="5.4" y="2.6" width="7.2" height="3" rx=".8"/><rect x="4.2" y="7.5" width="9.6" height="3" rx=".8"/><rect x="3" y="12.4" width="12" height="3" rx=".8"/>',
  tree:   '<rect x="6.6" y="2.4" width="4.8" height="3.4" rx=".8"/><rect x="1.8" y="11.8" width="4.4" height="3.4" rx=".8"/><rect x="11.8" y="11.8" width="4.4" height="3.4" rx=".8"/><path d="M9 5.8v2.9M4 11.8V8.7h10v3.1"/>',
  tap:    '<circle cx="9" cy="9" r="2.2"/><path d="M5.3 5.3a5.2 5.2 0 0 0 0 7.4"/><path d="M12.7 12.7a5.2 5.2 0 0 0 0-7.4"/>',
  grid:   '<rect x="2.4" y="2.4" width="5.6" height="5.6" rx="1"/><rect x="10" y="2.4" width="5.6" height="5.6" rx="1"/><rect x="2.4" y="10" width="5.6" height="5.6" rx="1"/><rect x="10" y="10" width="5.6" height="5.6" rx="1"/>',
  code:   '<path d="M6.4 5.4L2.6 9l3.8 3.6"/><path d="M11.6 5.4L15.4 9l-3.8 3.6"/><path d="M10.2 3.6L7.8 14.4"/>',
};

function glIcon(name) {
  return `<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${GL_ICON[name] || ''}</svg>`;
}

/* At-a-glance panel. The four STAR rows are tabs; selecting one lights the
   process phases that belong to it.
   cfg = {
     meta,
     star:  [{ id, label, body, phase }…],
     tags:  [string…],
     bands: [{ band, label, steps: [{ n, icon, label, note }…] }…],
   } */
function glanceHTML(cfg) {
  const first = cfg.star[0].id;

  const tabs = cfg.star.map((s, i) => `
        <button type="button" class="star-row" role="tab" id="gl-tab-${s.id}"
                data-star="${s.id}" data-phase="${esc(s.phase)}" aria-label="${esc(s.name || s.label)}"
                aria-controls="gl-panel" aria-selected="${i === 0 ? 'true' : 'false'}"
                tabindex="${i === 0 ? '0' : '-1'}">
          <span class="star-label">${esc(s.label)}</span>
          <span class="star-body">${esc(s.body)}</span>
        </button>`).join('');

  const tags = cfg.tags.map(t => `<li>${esc(t)}</li>`).join('');

  const bands = cfg.bands.map(b => `
          <div class="glance-band" data-band="${b.band}">
            <div class="band-label">${esc(b.label)}</div>
            <div class="band-cards">
              ${b.steps.map(s => `
              <div class="flow-card">
                <span class="flow-icon">${glIcon(s.icon)}</span>
                <span class="flow-label">${esc(s.label)}</span>
                <span class="flow-note">${esc(s.note)}</span>
              </div>`).join('')}
            </div>
          </div>`).join('');

  return `
  <section class="glance" data-active="${first}" aria-label="At a glance">
    <div class="glance-chrome">

/* NavStrip at bottom of every section */
function navStripHTML(active) {
  const idx = NAV_ORDER.indexOf(active);
  const prevId = idx > 0 ? NAV_ORDER[idx-1] : null;
  const nextId = idx < NAV_ORDER.length - 1 ? NAV_ORDER[idx+1] : null;
  const prev = prevId
    ? `<button class="prev" data-nav="${prevId}">&larr; ${esc(SECTION_META[prevId].label)}</button>`
    : `<span></span>`;
  const next = nextId
    ? `<button class="next" data-nav="${nextId}">
         <div class="next-label">Next up</div>
         <div class="next-title">${esc(SECTION_META[nextId].label)} &rarr;</div>
       </button>`
    : '';
  return `<div class="navstrip">${prev}${next}</div>`;
}

const contentInner = document.getElementById('content-inner');
const navGroupsEl  = document.getElementById('nav-groups');
const progressBar  = document.getElementById('progress-bar');
const progressPct  = document.getElementById('progress-pct');
const contentPane  = document.getElementById('content');
const sidebarEl    = document.getElementById('sidebar');
const scrimEl      = document.getElementById('scrim');
const menuBtn      = document.getElementById('menu-btn');

let active = 'intro';

function buildSidebar() {
  navGroupsEl.innerHTML = GROUPS.map(g => `
    <div class="nav-group">
      <div class="nav-group-label">${esc(g.group)}</div>
      ${g.ids.map(id => `
        <button class="nav-item" data-nav="${id}" type="button">
          <span class="nav-dot" aria-hidden="true"></span>
          <span class="nav-label">${esc(SECTION_META[id].label)}</span>
        </button>
      `).join('')}
    </div>
  `).join('');
}

function updateNavStates() {
  const activeIdx = NAV_ORDER.indexOf(active);
  navGroupsEl.querySelectorAll('.nav-item').forEach(btn => {
    const id = btn.dataset.nav;
    const idx = NAV_ORDER.indexOf(id);
    btn.classList.toggle('is-active', id === active);
    btn.classList.toggle('is-done', idx < activeIdx);
    if (id === active) btn.setAttribute('aria-current', 'true');
    else btn.removeAttribute('aria-current');
  });
}

function updateProgress() {
  const pct = PROGRESS_PCT[active] || 0;
  progressBar.style.width = pct + '%';
  progressPct.textContent = pct + '%';
}

/* At-a-glance, STAR rows act as tabs over the process panel. */
function setupGlance() {
  const gl = contentInner.querySelector('.glance');
  if (!gl) return;

  const tabs  = Array.from(gl.querySelectorAll('[role="tab"]'));
  const panel = gl.querySelector('[role="tabpanel"]');
  const phase = gl.querySelector('.glance-phase');
  if (!tabs.length || !panel) return;

  function select(tab, moveFocus) {
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
    });
    gl.setAttribute('data-active', tab.dataset.star);
    panel.setAttribute('aria-labelledby', tab.id);
    if (phase) phase.textContent = tab.dataset.phase;
    if (moveFocus) tab.focus();
  }

  tabs.forEach((tab, i) => {
    tab.addEventListener('click', () => select(tab, false));
    tab.addEventListener('keydown', (e) => {
      let next = null;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
      else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') next = tabs[(i - 1 + tabs.length) % tabs.length];
      else if (e.key === 'Home') next = tabs[0];
      else if (e.key === 'End') next = tabs[tabs.length - 1];
      if (next) { e.preventDefault(); select(next, true); }
    });
  });
}

function setupImgFade() {
  contentInner.querySelectorAll('img:not(.avatar-circle)').forEach(function(img) {
    if (img.complete && img.naturalWidth > 0) {
      img.classList.add('is-loaded');
    } else {
      img.addEventListener('load',  function() { this.classList.add('is-loaded'); }, { once: true });
      img.addEventListener('error', function() { this.classList.add('is-loaded'); }, { once: true });
    }
  });
}

function render(id) {
  if (!CONTENT[id]) return;
  active = id;

  const html = `
    <section class="section is-visible" id="section-${id}" aria-labelledby="title-${id}">
      ${CONTENT[id]()}
      ${navStripHTML(id)}
    </section>
  `;
  contentInner.innerHTML = html;
  contentInner.setAttribute('data-section', id);
  contentPane.scrollTop = 0;
  updateNavStates();
  updateProgress();
  setupImgFade();
  setupGlance();

  if (history.replaceState) {
    history.replaceState(null, '', window.location.pathname);
  }

  closeSidebar();
}

function openSidebar() {
  sidebarEl.classList.add('is-open');
  scrimEl.classList.add('is-open');
  menuBtn.setAttribute('aria-expanded', 'true');
}
function closeSidebar() {
  sidebarEl.classList.remove('is-open');
  scrimEl.classList.remove('is-open');
  menuBtn.setAttribute('aria-expanded', 'false');
}

document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    render(navBtn.dataset.nav);
  }
});

menuBtn.addEventListener('click', () => {
  if (sidebarEl.classList.contains('is-open')) closeSidebar();
  else openSidebar();
});
scrimEl.addEventListener('click', closeSidebar);

document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  const idx = NAV_ORDER.indexOf(active);
  if (e.key === 'ArrowRight' && idx < NAV_ORDER.length - 1) {
    e.preventDefault();
    render(NAV_ORDER[idx + 1]);
  } else if (e.key === 'ArrowLeft' && idx > 0) {
    e.preventDefault();
    render(NAV_ORDER[idx - 1]);
  } else if (e.key === 'Escape') {
    closeSidebar();
  }
});

/* ───────────────────────────────────────
   INIT
─────────────────────────────────────── */
buildSidebar();

const hashId = (location.hash || '').replace('#', '');
render(NAV_ORDER.includes(hashId) ? hashId : 'intro');
</script>

<script>
/* ── Custom cursor, skip on touch devices ── */
(function() {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const ring = document.createElement('div'); ring.id = 'cur-ring'; document.body.appendChild(ring);
  const dot  = document.createElement('div'); dot.id  = 'cur-dot';  document.body.appendChild(dot);
  let mx=0,my=0,cx=0,cy=0;
  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
  (function loop(){ cx+=(mx-cx)*.14; cy+=(my-cy)*.14; ring.style.left=mx+'px'; ring.style.top=my+'px'; dot.style.left=cx+'px'; dot.style.top=cy+'px'; requestAnimationFrame(loop); })();
})();

/* ── Pixel dissolve on images ── */
function pixelReveal(el) {
  const wrap = el.parentElement;
  const pos = getComputedStyle(wrap).position;
  if (pos === 'static') wrap.style.position = 'relative';
  const canvas = document.createElement('canvas');
  canvas.className = 'px-canvas';
  wrap.appendChild(canvas);
  let done = false;
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting && !done) { done=true; obs.disconnect(); runReveal(canvas,'#252420'); } });
  }, { threshold: 0.15 });
  obs.observe(wrap);
}
function runReveal(canvas, fill) {
  const W = canvas.parentElement.offsetWidth;
  const H = canvas.parentElement.offsetHeight;
  if (!W || !H) { canvas.remove(); return; }
  canvas.width=W; canvas.height=H;
  const ctx = canvas.getContext('2d');
  const BS = 14, cols=Math.ceil(W/BS), rows=Math.ceil(H/BS), total=cols*rows;
  const blocks=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) blocks.push([c,r]);
  for(let i=blocks.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [blocks[i],blocks[j]]=[blocks[j],blocks[i]]; }
  ctx.fillStyle=fill; ctx.fillRect(0,0,W,H);
  const batch=Math.ceil(total/24); let idx=0;
  function step(){
    const end=Math.min(idx+batch,total);
    for(let i=idx;i<end;i++){ const[c,r]=blocks[i]; ctx.clearRect(c*BS,r*BS,BS,BS); }
    idx=end;
    if(idx<total) requestAnimationFrame(step);
    else { canvas.style.transition='opacity .2s'; canvas.style.opacity='0'; setTimeout(()=>canvas.remove(),220); }
  }
  setTimeout(()=>requestAnimationFrame(step),60);
}
if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
  document.querySelectorAll('img').forEach(img => {
    if (img.complete) pixelReveal(img);
    else img.addEventListener('load', () => pixelReveal(img), {once:true});
  });
}

/* ── Scroll reveal sections ── */
const revObs = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('visible'); revObs.unobserve(e.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('section, .section, [data-section], h2, h3, .card, .finding, .stat').forEach(el => {
  el.classList.add('scroll-reveal'); revObs.observe(el);
});



/* ── Scroll word highlights ── */
const hlObs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    const words = e.target.querySelectorAll('.hl-word');
    if(e.isIntersecting) words.forEach((w,i) => setTimeout(()=>w.classList.add('lit'), i*100));
    else words.forEach(w=>w.classList.remove('lit'));
  });
}, { threshold: 0.5 });
document.querySelectorAll('p, li, .body-text, .stack-body').forEach(el => { if(el.querySelectorAll('.hl-word').length) hlObs.observe(el); });
</script>
